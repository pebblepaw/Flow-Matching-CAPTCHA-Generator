[project]
name = "cs4243"
version = "1.0.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.10.7",
    "numpy>=2.3.4",
    "opencv-python>=4.11.0.86",
    "pillow>=12.0.0",
    "scipy>=1.14.0",
    "tqdm>=4.66.0",
]

[project.optional-dependencies]
cpu = [
  "torch",
  "torchvision",
]
cu121 = [
  "torch",
  "torchvision",
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu",  extra = "cpu"  },
  { index = "pytorch-cu121", extra = "cu121" },
]
torchvision = [
  { index = "pytorch-cpu",  extra = "cpu"  },
  { index = "pytorch-cu121", extra = "cu121" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.uv]
conflicts = [
  [ { extra = "cpu" }, { extra = "cu121" } ]
]
